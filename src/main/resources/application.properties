spring.application.name=batch

spring.datasource.url=jdbc:mysql://localhost:3306/movie_db
spring.datasource.username=root
spring.datasource.password=Admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# this line will tell spring to look at all @Entity classes. If any corresponding table is missing in the DB, create it (or alter it).

spring.batch.jdbc.initialize-schema=always
# this line will tell spring to initialize spring batch metaDB table. Spring Batch uses these internal tables to track job executions, steps, parameters, context, etc.

spring.batch.job.enabled=false
# Notes:
# - Adding spring-boot-starter-batch autoconfigures batch beans using BatchAutoConfiguration.java.
# - By default, all Spring Batch jobs run on application startup.
# - To prevent this auto-execution (common in manual or API-triggered jobs), set:
#     spring.batch.job.enabled=false (default is true)

# OMDb API config
omdb.apiKey=d9d1db37
omdb.baseUrl=http://www.omdbapi.com/